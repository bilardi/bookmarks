name: Publish the redirect

# GitHub Pages serves this repository on alessandra.bilardi.net/bookmarks/, the
# address of the bookmarks before this system: only the page that sends to the
# new one is published there.
on:
  push:
    branches: [master]
    paths: [redirect/**, .github/workflows/redirect.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A deploy that started finishes: only the runs still queued give way to the latest.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v5
