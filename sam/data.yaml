AWSTemplateFormatVersion: "2010-09-09"
Description: bookmarks data (the DynamoDB single table)

Parameters:
  ProjectName:
    Type: String
    Default: bookmarks
    Description: Names the table; the deploy passes the stack name

Resources:
  # A stack of its own, created first: the invitation trigger of the pool reads it,
  # and so do the functions of the API, which depend on the pool in turn.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProjectName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: N }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # One folder of one owner, in order.
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # The owners who share something: sparse, only their profiles carry the key.
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

Outputs:
  TableName:
    Description: DynamoDB single-table name
    Value: !Ref Table
  TableArn:
    Description: ARN of the table, for the policies of the functions
    Value: !GetAtt Table.Arn
